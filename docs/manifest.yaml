bundle: TortoiseBots Knowledge Base
version: 1.0.0
format: open-knowledge-format/v1
description: >-
  Authoritative, traversable knowledge base for the TortoiseBots native module,
  documenting class AI, player controls, configuration knobs, and architecture invariants.

entrypoints:
  human_quickstart: play/getting-started.md
  features: play/features.md
  player_controls: play/commands/README.md
  class_catalog: classes/overview.md
  configuration: server/configuration.md
  observability: server/dashboard.md
  developer_architecture: developers/architecture.md

categories:
  play:
    description: "Guides, party controls, whisper commands, and dungeon tactics for players."
  world:
    description: "Living world systems: bot lifecycles, leveling, economy, and PvP/dungeon queues."
  classes:
    description: "Deep-dive documentation for all 9 playable classes, specs and shared behavior on ForeverCore."
  server:
    description: "Installation, server configuration, settings reference, pool management, and observability."
  developers:
    description: "Architecture, strategy engine internals, host API boundary, donor lineage, and development guides."
  reference:
    description: "Authoritative machine and human reference data."

nodes:
  # Classes
  - id: classes-overview
    path: classes/overview.md
    category: classes
    summary: Summary of the nine Classic classes, spec detection, combat roles, and shared behaviors in TortoiseBots.
  - id: classes-warrior
    path: classes/warrior.md
    category: classes
    summary: Complete guide to Warrior bot AI, stance dancing, tanking rotations, melee DPS, shouts, and class abilities.
  - id: classes-paladin
    path: classes/paladin.md
    category: classes
    summary: Complete guide to Paladin bot AI, Holy healing, Protection tanking, Retribution DPS, blessing coordination, and Judgement upkeep.
  - id: classes-hunter
    path: classes/hunter.md
    category: classes
    summary: Complete guide to Hunter bot AI, pet management, ranged rotations, melee Survival, and Aspect of the Viper logic.
  - id: classes-rogue
    path: classes/rogue.md
    category: classes
    summary: Complete guide to Rogue bot AI, stealth openers, combo point spenders, poison application, interrupts, and dungeon threat drops.
  - id: classes-priest
    path: classes/priest.md
    category: classes
    summary: Complete guide to Priest bot AI, healing ladders, Power Word Shield rules, threat drops, Shadow DPS, and class abilities.
  - id: classes-shaman
    path: classes/shaman.md
    category: classes
    summary: Complete guide to Shaman bot AI, totem sets, weapon imbues, chain heals, shocks, and class abilities.
  - id: classes-mage
    path: classes/mage.md
    category: classes
    summary: Complete guide to Mage bot AI, elemental rotations, Polymorph CC, Counterspell interrupts, conjured refreshments, and Arcane Power safety.
  - id: classes-warlock
    path: classes/warlock.md
    category: classes
    summary: Complete guide to Warlock bot AI, DoT spreading, demon summoning, Soul Shard economy, Life Tap, and class abilities.
  - id: classes-druid
    path: classes/druid.md
    category: classes
    summary: Complete guide to Druid bot AI, shapeshifting forms, tanking, healing, DPS rotations, and the Forever class spell kit.

  # Play
  - id: play-glossary
    path: play/glossary.md
    category: play
    summary: Short explanations of abbreviations and TortoiseBots terms used across the ForeverCore documentation.
  - id: play-getting-started
    path: play/getting-started.md
    category: play
    summary: How to log your own characters in as bots on ForeverCore, order them, and meet the free bots.
  - id: play-features
    path: play/features.md
    category: play
    summary: Catalog of what the ForeverCore build does, with its player commands, engine, pool, guild orders, market, queues, switches and defaults.
  - id: play-commands
    path: play/commands/README.md
    category: play
    summary: "The command channels on ForeverCore: the player .bot verbs, the addon channel, the GameMaster .tb host commands and their permission tiers."
  - id: play-commands-party-actions
    path: play/commands/party-actions.md
    category: play
    summary: Party combat orders, toggles and movement on the party chat command, the addon and the GameMaster order commands.
  - id: play-commands-commander
    path: play/commands/commander.md
    category: play
    summary: GameMaster commands that bind bots to a commander, issue party orders, and report a binding.
  - id: play-commands-roster-and-hiring
    path: play/commands/roster-and-hiring.md
    category: play
    summary: Commands for logging your own characters in as bots, listing them, summoning, gearing and maintaining them.
  - id: play-commands-bot-panel
    path: play/commands/bot-panel.md
    category: play
    summary: Chat and addon commands that inspect a bot, show its bags and professions, and set behaviours, totems, blessings and choices.
  - id: play-commands-whispers
    path: play/commands/whispers.md
    category: play
    summary: "The words a bot obeys when you whisper it or speak in its party, the permission tiers behind them, the guild-invite requests a bot-run guild answers, and what Forever does not answer yet."
  - id: play-commands-addon
    path: play/commands/addon.md
    category: play
    summary: Installing the TortoiseBotsForeverManager addon, what its tabs do, and the TBM messages the server answers.
  - id: play-commands-los-query
    path: play/commands/los-query.md
    category: play
    summary: The GameMaster command that asks the server whether two units can see each other, with the distance, for planning pull stands and diagnosing sight problems.
  - id: play-guild-orders
    path: play/guild-orders.md
    category: play
    summary: How to send guild bots to farm or craft items for the guild bank, and what each order state means.
  - id: play-dungeons-and-raids
    path: play/dungeons-and-raids.md
    category: play
    summary: How companion bots fight in ForeverCore instances, including pulling, crowd control, interrupts, hazards, wipe recovery, loot and the GameMaster run leader.
  - id: play-dungeon-reference
    path: play/dungeon-reference.md
    category: play
    summary: The dungeon plans the run leader uses on ForeverCore, with each plan's map and boss order, and the dungeons that have no plan yet.
  - id: play-dungeon-run-leader
    path: play/dungeon-run-leader.md
    category: play
    summary: "The run leader (.tb run, AiPlayerbot.DungeonSelfClear, on by default, work in progress) that lets a bound bot party clear a stored dungeon plan by itself, its safety rules, supported steps and the keys its doors need, and the plan tables the exporter fills."
  - id: play-boss-tactics
    path: play/boss-tactics.md
    category: play
    summary: Boss tactics are not on ForeverCore yet; bots fight with their ordinary class and raid AI.
  - id: play-refusal-rows
    path: play/refusal-rows.md
    category: play
    summary: "The rule that a decision not to act says why, the run notes and log rows that follow it on ForeverCore, and where the Turtle-only row inventory went."
  - id: play-known-limitations
    path: play/known-limitations.md
    category: play
    summary: What the ForeverCore build does not do yet, which Turtle WoW features are absent, and the timers and quirks to expect.

  # World
  - id: world-living-world
    path: world/living-world.md
    category: world
    summary: How free pool bots roam the world on their own, level up, travel, quest, fish, rest and buy their gear.
  - id: world-social
    path: world/social.md
    category: world
    summary: How pool bots greet players, buff them, group for shared quests, join and run guilds, answer a whisper asking a bot-run guild for an invite, and trade with their owner.
  - id: world-queues
    path: world/queues.md
    category: world
    summary: How pool bots fill a player's dungeon party through the module's own queue and play Warsong Gulch and Arathi Basin.
  - id: world-economy
    path: world/economy.md
    category: world
    summary: How bots earn gold, sell loot, repair gear, and trade on the living auction house.

  # Server
  - id: server-install
    path: server/install.md
    category: server
    summary: How to build, install and update TortoiseBots for ForeverCore, including configuration and database delivery.
  - id: server-configuration
    path: server/configuration.md
    category: server
    summary: Configuration files, restart rules, a starting preset, the settings index, and keys the Forever build does not read.
  - id: server-config-keys
    path: server/config-keys.md
    category: server
    summary: Generated per-key census of aiplayerbot.conf keys and whether the Forever build consumes them.
  - id: server-settings-party
    path: server/settings/party.md
    category: server
    summary: Configuration settings for owned bots, alt level sync, follow behaviour and formations, maintenance, autogear, party loot and quest sync.
  - id: server-settings-hiring
    path: server/settings/hiring.md
    category: server
    summary: Mercenary hiring, hire prices, gear tiers and recruiter world buffs are not part of the ForeverCore build; bots come from the bot pool or from a player's own characters.
  - id: server-settings-class-behaviour
    path: server/settings/class-behaviour.md
    category: server
    summary: Configuration flags controlling class-specific AI decisions for hunters, paladins, rogues, warlocks, and warriors.
  - id: server-settings-dungeons-raids
    path: server/settings/dungeons-raids.md
    category: server
    summary: "Settings for the run leader and for bot behaviour in dungeons: pulls and rests, retreats, charmed allies, threat lines, crowd control, creature auras, bomb runout, raid reactions, the combat monitor and reach."
  - id: server-settings-combat
    path: server/settings/combat.md
    category: server
    summary: Configuration thresholds for health, mana, engagement distances, casting pacing, pull rules, and open-world PvP for bot AI.
  - id: server-settings-world-population
    path: server/settings/world-population.md
    category: server
    summary: The module's bot pool settings, the immersion keys the Forever build acts on, and the keys that do nothing here.
  - id: server-settings-economy
    path: server/settings/economy.md
    category: server
    summary: Configuration settings for the simulated auction house market, vendor trips, and bot economy.
  - id: server-settings-guild-orders
    path: server/settings/guild-orders.md
    category: server
    summary: Configuration switches for guild bank access, the bot rank that guild orders use, and keeping crafting tools.
  - id: server-settings-queues
    path: server/settings/queues.md
    category: server
    summary: Settings for the module's dungeon-party fill and the Warsong Gulch / Arathi Basin bot round.
  - id: server-settings-performance
    path: server/settings/performance.md
    category: server
    summary: Configuration settings for AI time budgets, activity throttling, the world tick target, and core server tuning for large bot populations.
  - id: server-settings-logging
    path: server/settings/logging.md
    category: server
    summary: Configuration settings for the module's log category, bot log file, CSV event logs, per-bot action logs, action counts, healer and boss diagnostics, and run traces.
  - id: server-admin-commands
    path: server/admin-commands.md
    category: server
    summary: The .tb GameMaster and server console commands for the bot pool, dungeon fill, battlegrounds, guild orders, runs and diagnostics.
  - id: server-bot-pool
    path: server/bot-pool.md
    category: server
    summary: How the ForeverCore pool creates its accounts and characters, keeps a target online, prunes failed rows and resets at startup.
  - id: server-dashboard
    path: server/dashboard.md
    category: server
    summary: How the ForeverCore build feeds the optional web dashboard, the module settings behind it, and what its tabs and APIs show.
  - id: server-run-trace
    path: server/run-trace.md
    category: server
    summary: The .tb trace recorder for a party's run as a bt-trace v1 JSONL file plus a summary, scored offline.
  - id: server-decision-capture
    path: server/decision-capture.md
    category: server
    summary: The opt-in run-leader decision recorder, reading its newest rows in game, the tb-decision-capture format, and the replay fixture workflow.

  # Developers
  - id: developers
    path: developers/README.md
    category: developers
    summary: Architecture, strategy engine internals, host API boundary, donor lineage, and development guides.
  - id: developers-architecture
    path: developers/architecture.md
    category: developers
    summary: "How the optional module sits on ForeverCore: module-owned bot sessions, script hooks, one world thread, and build invariants."
  - id: developers-guild-supply
    path: developers/guild-supply.md
    category: developers
    summary: "How the Forever host runs guild orders: store, step policy, providers, delivery, permissions and the addon transport."
  - id: developers-strategy-engine
    path: developers/strategy-engine.md
    category: developers
    summary: The PlayerbotAI decision cycle, registered keys, action relevance, failure backoff, and the host tick that schedules player-owned bots ahead of the pool.
  - id: developers-bot-mechanics
    path: developers/bot-mechanics.md
    category: developers
    summary: Target selection, interrupt and crowd-control rules, movement, upkeep, and the guards active in the Forever engine build.
  - id: developers-donor-hierarchy
    path: developers/donor-hierarchy.md
    category: developers
    summary: Evidence priority and architectural guidelines when referencing mod-playerbots and ForeverCore.
  - id: developers-host-api
    path: developers/host-api.md
    category: developers
    summary: "How the Forever module attaches to ForeverCore: bot sessions, lifecycle, script hooks, command entry points, host services, and data mirrors."
  - id: developers-licensing-audit
    path: developers/licensing-audit.md
    category: developers
    summary: Audit record of donor source licences, how they combine with ForeverCore and the module's AGPL-3.0 grant, and release gates.
  - id: developers-guild-supply
    path: developers/guild-supply.md
    category: developers
    summary: "How the Forever host runs guild orders: store, step policy, providers, delivery, permissions and the addon transport."
  - id: developers-data
    path: developers/data/README.md
    category: developers
    summary: Tab-separated reference tables for the Forever build's capabilities, donor provenance, spell coverage, and talent builds.

  # Reference
  - id: docs-index
    path: README.md
    category: reference
    summary: Documentation start page, role-based navigation, task finder, and audience directory.
  - id: reference-hire-gear
    path: reference/hire-gear.md
    category: reference
    summary: Static level-60 hire sets per class/spec/tier from the offline generator.
