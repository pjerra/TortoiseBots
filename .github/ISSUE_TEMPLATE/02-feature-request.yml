name: Feature request
description: Suggest an idea or an improvement. Going to build it yourself? Use "Feature spec" instead.
title: "[feature][area]: "
labels:
  - enhancement

body:
  - type: dropdown
    id: area
    attributes:
      label: What does this relate to?
      description: "Optional: put a short area in the title too, e.g. [bug][commander], [feature][random-bots], [bug][combat]."
      options:
        - Combat or class behavior
        - Movement or travel
        - Levelling, questing, or the random bot pool
        - Hired companions or my own bots
        - Remote commander
        - Dungeon, LFT, raid, or battleground
        - Auction house or economy
        - Commands or the TortoiseBotsManager addon
        - Dashboard
        - Build or documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: What would you like to see?
      description: Describe the problem or desired improvement in your own words.
      placeholder: |
        I would like...
        This would help because...
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional information
      description: Optional. Add examples, screenshots, links, or mockups.
