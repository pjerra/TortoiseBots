name: forever-tools-tests

# Daily, and on a pull request that touches forever/tools/**: the Python tests of the ForeverCore module tools
# (forever/tools/test_*.py). verify.yml runs only tools/test_*.py; these are the ones under forever/tools. The runner
# reads each file and runs it the way it is meant to run: a file with unittest.TestCase classes runs as
# python3 -m unittest forever/tools/<file>.py, a script-style file runs as python3 forever/tools/<file>.py (unittest
# would exit 5 "NO TESTS RAN" on those, which is not a pass). A file that ran zero checks fails, and a file that fails
# is run once more (the fake-ssh census tests use flock and are timing sensitive). Real bugs the tests catch are listed
# in the runner's KNOWN_FAILING with their issue number. About 2 minutes; no secrets.
on:
  schedule:
    - cron: "11 5 * * *"
  pull_request:
    paths:
      - "forever/tools/**"
      - ".github/workflows/tools-tests.yml"
  workflow_dispatch:

concurrency:
  group: forever-tools-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tools-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install rsync (the fake-ssh census tests call it)
        run: |
          command -v rsync >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends rsync; }

      - name: forever/tools tests, each file in its own mode
        run: python3 forever/tools/run_tools_tests.py
