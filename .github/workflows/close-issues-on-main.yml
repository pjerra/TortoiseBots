name: Close issues on main

# GitHub only honours "Fixes #N" in a PR merged straight into main. Feature PRs
# merge into dev, so when dev lands in main this closes the issues those PRs
# name with a closing keyword ("part of #N" and bare "#N" stay open).
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close issues fixed by the merged PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_PR: ${{ github.event.pull_request.number }}
        run: |
          prs=$(git log --format=%s "$MERGE_SHA^1..$MERGE_SHA" \
            | sed -nE 's/^Merge pull request #([0-9]+) .*/\1/p' | grep -vx "$RELEASE_PR" || true)
          for pr in $prs; do
            gh pr view "$pr" --json body --jq '.body // ""' \
              | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+' \
              | grep -oE '[0-9]+$' \
              | while read -r issue; do
                  info=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue" \
                    --jq '[.state, (has("pull_request") | tostring)] | join(" ")') || continue
                  if [ "$info" = "open false" ]; then
                    gh issue close "$issue" --reason completed && echo "Closed #$issue (from #$pr)"
                  fi
                done
          done
